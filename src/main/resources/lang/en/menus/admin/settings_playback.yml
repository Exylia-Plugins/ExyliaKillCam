    material: ENDER_EYE
    name: "{letters}Playback {letters_black}▸ <gradient:{primary}:{secondary_light}>First person</gradient>"
    lore:
      - "{letters_black}Playback setting"
      - ""
      - "{primary}✎ Information"
      - " {letters}Watch through the killer's eyes."
      - " {letters}Off shows it behind the victim."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:star} {letters}State{letters_black}: %playback_killcam_first_person%"
      - "  {letters_black}· {info}{icon:book} {letters}Default{letters_black}: %playback_killcam_first_person_default%"
      - ""
      - "%playback_killcam_first_person_click%"
    actions:
      - "exyliakillcam:setting playback killcam.first-person"

  killcam-hold-seconds:
