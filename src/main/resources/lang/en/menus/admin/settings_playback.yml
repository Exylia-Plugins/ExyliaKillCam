      - " {letters}How long the camera stays on the"
      - " {letters}body for the fall and kill effect."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:clock} {letters}Length{letters_black}: %playback_killcam_hold_seconds%"
      - "  {letters_black}· {info}{icon:book} {letters}Default{letters_black}: %playback_killcam_hold_seconds_default%"
      - ""
      - "%playback_killcam_hold_seconds_click%"
    actions:
      - "exyliakillcam:setting playback killcam.hold-seconds"

  killcam-narrate-hits:
    slot: 16
    material: WRITABLE_BOOK
    name: "{letters}Playback {letters_black}▸ <gradient:{primary}:{secondary_light}>Narrate hits</gradient>"
    lore:
      - "{letters_black}Playback setting"
      - ""
      - "{primary}✎ Information"
      - " {letters}Writes each hit the victim took in"
      - " {letters}their chat as the camera passes."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:book} {letters}State{letters_black}: %playback_killcam_narrate_hits%"
      - "  {letters_black}· {info}{icon:book} {letters}Default{letters_black}: %playback_killcam_narrate_hits_default%"
      - ""
      - "%playback_killcam_narrate_hits_click%"
    actions:
      - "exyliakillcam:setting playback killcam.narrate-hits"

  back:
    slot: 22
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: "{letters}Back {letters_black}▸ <gradient:{error}:{error_light}>Settings</gradient>"
