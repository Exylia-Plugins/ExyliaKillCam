# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# How a killcam plays. Everything else is in config.yml.

title: "{primary}&lSETTINGS {letters_black}» {highlight}Playback"
size: 27
type: SIMPLE

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: SPYGLASS
    name: "<gradient:{primary}:{secondary_light}>Playback</gradient>"
    lore:
      - "{letters_black}Playback settings"
      - ""
      - "{primary}✎ Information"
      - " {letters}What a killcam shows and how."

  killcam-default-mode:
    slot: 10
    material: COMPARATOR
    name: "{letters}Playback {letters_black}▸ <gradient:{primary}:{secondary_light}>Default mode</gradient>"
    lore:
      - "{letters_black}Playback setting"
      - ""
      - "{primary}✎ Information"
      - " {letters}What players get until they"
      - " {letters}pick with {highlight}/killcam mode{letters}."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:star} {letters}Mode{letters_black}: %playback_killcam_default_mode%"
      - "  {letters_black}· {info}{icon:book} {letters}Default{letters_black}: %playback_killcam_default_mode_default%"
      - ""
      - "%playback_killcam_default_mode_click%"
    actions:
      - "exyliakillcam:setting playback killcam.default-mode"

  killcam-seconds-before:
    slot: 11
    material: CLOCK
    name: "{letters}Playback {letters_black}▸ <gradient:{primary}:{secondary_light}>Seconds before</gradient>"
    lore:
      - "{letters_black}Playback setting"
      - ""
      - "{primary}✎ Information"
      - " {letters}How much of the fight is shown"
      - " {letters}before the death."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:clock} {letters}Length{letters_black}: %playback_killcam_seconds_before%"
      - "  {letters_black}· {info}{icon:book} {letters}Default{letters_black}: %playback_killcam_seconds_before_default%"
      - ""
      - "%playback_killcam_seconds_before_click%"
    actions:
      - "exyliakillcam:setting playback killcam.seconds-before"

  killcam-slow-motion-seconds:
    slot: 12
    material: SNOWBALL
    name: "{letters}Playback {letters_black}▸ <gradient:{primary}:{secondary_light}>Slow motion</gradient>"
    lore:
      - "{letters_black}Playback setting"
      - ""
      - "{primary}✎ Information"
      - " {letters}The last moment before the death"
      - " {letters}plays slowly. {highlight}0 {letters}is never."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:clock} {letters}Length{letters_black}: %playback_killcam_slow_motion_seconds%"
      - "  {letters_black}· {info}{icon:book} {letters}Default{letters_black}: %playback_killcam_slow_motion_seconds_default%"
      - ""
      - "%playback_killcam_slow_motion_seconds_click%"
    actions:
      - "exyliakillcam:setting playback killcam.slow-motion-seconds"

  killcam-slow-motion-speed:
    slot: 13
    material: FEATHER
    name: "{letters}Playback {letters_black}▸ <gradient:{primary}:{secondary_light}>Slow speed</gradient>"
    lore:
      - "{letters_black}Playback setting"
      - ""
      - "{primary}✎ Information"
      - " {letters}How fast the slow motion plays:"
      - " {letters}{highlight}0.5 {letters}is half speed."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:star} {letters}Speed{letters_black}: %playback_killcam_slow_motion_speed%"
      - "  {letters_black}· {info}{icon:book} {letters}Default{letters_black}: %playback_killcam_slow_motion_speed_default%"
      - ""
      - "%playback_killcam_slow_motion_speed_click%"
    actions:
      - "exyliakillcam:setting playback killcam.slow-motion-speed"

  killcam-first-person:
