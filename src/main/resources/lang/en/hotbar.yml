# The button on the hotbar while watching a killcam.
#
# Drawn on the client, never put in the inventory: the viewer's own items stay
# underneath and come back when the killcam ends. Slots 0-8 are the hotbar.

lock: FULL
pickup: false
hide_rest: true

items:

  skip:
    slot: 4
    material: BARRIER
    name: '{error}&lSKIP'
    lore:
      - ''
      - '{secondary}Information:'
      - ' {letters_black}▎ {letters}Leave the killcam and go back'
      - ' {letters_black}▎ {letters}to where you were.'
      - ''
      - '{warning}➥ Click to skip'
      - ''
    actions:
      - 'exyliakillcam:skip'
