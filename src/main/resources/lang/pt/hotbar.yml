# O botão na barra rápida enquanto assistes a uma killcam.
#
# Drawn on the client, never put in the inventory: the viewer's own items stay
# underneath and come back when the killcam ends. Slots 0-8 are the hotbar.

menu-version: 1

lock: FULL
pickup: false
hide_rest: true

items:

  skip:
    slot: 4
    material: BARRIER
    name: "{letters}Killcam {letters_black}▸ <gradient:{error}:{error_light}>Pular</gradient>"
    lore:
      - "{letters_black}Ação da killcam"
      - ""
      - "{error}✎ Informação"
      - " {letters}Sai da killcam e volta"
      - " {letters}para onde estavas."
      - ""
      - "{error}» Clica para pular"
    actions:
      - 'exyliakillcam:skip'
