    slot: 4
    material: SPYGLASS
    name: "<gradient:{primary}:{secondary_light}>Reprodução</gradient>"
    lore:
      - "{letters_black}Opções de Reprodução"
      - ""
      - "{primary}✎ Informações"
      - " {letters}O que a killcam mostra e como."

  killcam-default-mode:
    slot: 10
    material: COMPARATOR
    name: "{letters}Reprodução {letters_black}▸ <gradient:{primary}:{secondary_light}>Modo padrão</gradient>"
    lore:
      - "{letters_black}Opção de Reprodução"
      - ""
      - "{primary}✎ Informações"
      - " {letters}O que os jogadores recebem até"
      - " {letters}escolher com {highlight}/killcam mode{letters}."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:star} {letters}Modo{letters_black}: %playback_killcam_default_mode%"
      - "  {letters_black}· {info}{icon:book} {letters}Padrão{letters_black}: %playback_killcam_default_mode_default%"
