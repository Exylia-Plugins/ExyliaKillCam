    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: BONE
    name: "<gradient:{primary}:{secondary_light}>Mortes</gradient>"
    lore:
      - "{letters_black}Opções de Mortes"
      - ""
      - "{primary}✎ Informações"
      - " {letters}Quais mortes têm killcam."

  deaths-mobs:
    slot: 10
    material: ZOMBIE_HEAD
    name: "{letters}Mortes {letters_black}▸ <gradient:{primary}:{secondary_light}>Mortes por mobs</gradient>"
    lore:
      - "{letters_black}Opção de Mortes"
      - ""
      - "{primary}✎ Informações"
      - " {letters}Dá killcam também à morte por um"
      - " {letters}mob, não só à de um jogador."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:star} {letters}Estado{letters_black}: %deaths_deaths_mobs%"
      - "  {letters_black}· {info}{icon:book} {letters}Padrão{letters_black}: %deaths_deaths_mobs_default%"
      - ""
      - "%deaths_deaths_mobs_click%"
