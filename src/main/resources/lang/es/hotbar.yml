# El botón de la barra rápida mientras ves una killcam.
#
# Drawn on the client, never put in the inventory: the viewer's own items stay
# underneath and come back when the killcam ends. Slots 0-8 are the hotbar.

lock: FULL
pickup: false
hide_rest: true

items:

  skip:
    slot: 4
    material: BARRIER
    name: '{error}&lSALTAR'
    lore:
      - ''
      - '{secondary}Información:'
      - ' {letters_black}▎ {letters}Sal de la killcam y vuelve'
      - ' {letters_black}▎ {letters}a donde estabas.'
      - ''
      - '{warning}➥ Clic para saltar'
      - ''
    actions:
      - 'exyliakillcam:skip'
