# Кнопка на панели быстрого доступа во время киллкама.
#
# Drawn on the client, never put in the inventory: the viewer's own items stay
# underneath and come back when the killcam ends. Slots 0-8 are the hotbar.

menu-version: 1

lock: FULL
pickup: false
hide_rest: true

items:

  skip:
    slot: 4
    material: BARRIER
    name: "{letters}Killcam {letters_black}▸ <gradient:{error}:{error_light}>Пропустить</gradient>"
    lore:
      - "{letters_black}Действие киллкама"
      - ""
      - "{error}✎ Информация"
      - " {letters}Выйти из киллкама и вернуться"
      - " {letters}туда, где вы были."
      - ""
      - "{error}» Нажмите, чтобы пропустить"
    actions:
      - 'exyliakillcam:skip'
