    lore:
      - "{letters_black}Настройки: Просмотр"
      - ""
      - "{primary}✎ Информация"
      - " {letters}Что показывает киллкам и как."

  killcam-default-mode:
    slot: 10
    material: COMPARATOR
    name: "{letters}Просмотр {letters_black}▸ <gradient:{primary}:{secondary_light}>Режим по умолчанию</gradient>"
    lore:
      - "{letters_black}Настройка: Просмотр"
      - ""
      - "{primary}✎ Информация"
      - " {letters}Что получают игроки, пока не"
      - " {letters}выберут {highlight}/killcam mode{letters}."
      - ""
      - "{primary}✦ Статус"
      - "  {letters_black}· {info}{icon:star} {letters}Режим{letters_black}: %playback_killcam_default_mode%"
      - "  {letters_black}· {info}{icon:book} {letters}По умолчанию{letters_black}: %playback_killcam_default_mode_default%"
