    material: ZOMBIE_HEAD
    name: "{letters}Смерти {letters_black}▸ <gradient:{primary}:{secondary_light}>Смерти от мобов</gradient>"
    lore:
      - "{letters_black}Настройка: Смерти"
      - ""
      - "{primary}✎ Информация"
      - " {letters}Киллкам и за смерть от моба,"
      - " {letters}а не только от игрока."
