# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# Which deaths get a killcam and what is recorded. Everything else is in config.yml.

title: "{primary}&lНАСТРОЙКИ {letters_black}» {highlight}Смерти"
size: 27
type: SIMPLE

open_sounds:
