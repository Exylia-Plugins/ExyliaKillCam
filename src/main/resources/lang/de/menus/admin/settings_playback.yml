# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# Wie eine Killcam abgespielt wird. Alles andere steht in der config.yml.

title: "{primary}&lEINSTELLUNGEN {letters_black}» {highlight}Wiedergabe"
