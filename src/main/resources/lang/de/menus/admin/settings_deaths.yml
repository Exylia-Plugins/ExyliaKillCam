# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# Welche Tode eine Killcam bekommen und was aufgezeichnet wird. Alles andere steht in der config.yml.

title: "{primary}&lEINSTELLUNGEN {letters_black}» {highlight}Tode"
size: 27
type: SIMPLE

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: BONE
    name: "<gradient:{primary}:{secondary_light}>Tode</gradient>"
    lore:
      - "{letters_black}Tode-Einstellungen"
      - ""
      - "{primary}✎ Information"
      - " {letters}Welche Tode eine Killcam bekommen."

  deaths-mobs:
    slot: 10
    material: ZOMBIE_HEAD
    name: "{letters}Tode {letters_black}▸ <gradient:{primary}:{secondary_light}>Mob-Tode</gradient>"
    lore:
      - "{letters_black}Tode-Einstellung"
      - ""
      - "{primary}✎ Information"
      - " {letters}Gibt auch dem Tod durch einen Mob"
      - " {letters}eine Killcam, nicht nur durch Spieler."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:star} {letters}Zustand{letters_black}: %deaths_deaths_mobs%"
      - "  {letters_black}· {info}{icon:book} {letters}Standard{letters_black}: %deaths_deaths_mobs_default%"
      - ""
      - "%deaths_deaths_mobs_click%"
    actions:
      - "exyliakillcam:setting deaths deaths.mobs"

  deaths-disabled-worlds:
    slot: 11
    material: BARRIER
    name: "{letters}Tode {letters_black}▸ <gradient:{primary}:{secondary_light}>Deaktivierte Welten</gradient>"
