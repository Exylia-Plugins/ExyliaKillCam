# Le bouton de la barre rapide pendant une killcam.
#
# Drawn on the client, never put in the inventory: the viewer's own items stay
# underneath and come back when the killcam ends. Slots 0-8 are the hotbar.

lock: FULL
pickup: false
hide_rest: true

items:

  skip:
    slot: 4
    material: BARRIER
    name: '{error}&lPASSER'
    lore:
      - ''
      - '{secondary}Informations :'
      - ' {letters_black}▎ {letters}Quitte la killcam et reviens'
      - ' {letters_black}▎ {letters}là où tu étais.'
      - ''
      - '{warning}➥ Clique pour passer'
      - ''
    actions:
      - 'exyliakillcam:skip'
