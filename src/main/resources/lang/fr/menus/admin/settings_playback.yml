# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# How a killcam plays. Everything else is in config.yml.

title: "{primary}&lPARAMÈTRES {letters_black}» {highlight}Lecture"
size: 27
type: SIMPLE

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: SPYGLASS
    name: "<gradient:{primary}:{secondary_light}>Lecture</gradient>"
    lore:
      - "{letters_black}Réglages Lecture"
      - ""
      - "{primary}✎ Informations"
      - " {letters}Ce que montre la killcam."

  killcam-default-mode:
    slot: 10
    material: COMPARATOR
    name: "{letters}Lecture {letters_black}▸ <gradient:{primary}:{secondary_light}>Mode par défaut</gradient>"
    lore:
      - "{letters_black}Réglage Lecture"
      - ""
      - "{primary}✎ Informations"
      - " {letters}Ce que reçoivent les joueurs avant"
      - " {letters}de choisir avec {highlight}/killcam mode{letters}."
      - ""
      - "{primary}✦ État"
      - "  {letters_black}· {info}{icon:star} {letters}Mode{letters_black}: %playback_killcam_default_mode%"
      - "  {letters_black}· {info}{icon:book} {letters}Par défaut{letters_black}: %playback_killcam_default_mode_default%"
      - ""
      - "%playback_killcam_default_mode_click%"
    actions:
      - "exyliakillcam:setting playback killcam.default-mode"

